name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

      - name: Read release version
        id: version
        run: echo "value=$(node scripts/version.mjs print)" >> "$GITHUB_OUTPUT"

      - name: Package module for Foundry
        run: node scripts/package-release.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Foundry Procedural Generator ${{ steps.version.outputs.value }}
          body: |
            Automated release for `${{ steps.version.outputs.value }}`.

            Foundry VTT install manifest URL:

            `https://github.com/EmberWolf-Games/foundry-procedural-generator/releases/latest/download/module.json`

            Requires a **public** GitHub repository so Foundry can fetch release assets without authentication.
          files: |
            dist/foundry-procedural-generator.zip
            dist/module.json
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Verify public manifest URL (Foundry install check)
        run: |
          MANIFEST_URL="https://github.com/EmberWolf-Games/foundry-procedural-generator/releases/latest/download/module.json"
          ZIP_URL="https://github.com/EmberWolf-Games/foundry-procedural-generator/releases/latest/download/foundry-procedural-generator.zip"
          echo "Checking $MANIFEST_URL"
          curl -fsSL "$MANIFEST_URL" -o /tmp/module.json
          test -s /tmp/module.json
          node -e "const m=require('/tmp/module.json'); if (m.id !== 'foundry-procedural-generator') throw new Error('Invalid manifest id')"
          echo "Checking $ZIP_URL"
          curl -fsSLI "$ZIP_URL" | grep -i '^HTTP/.* 200'

      - name: Bump hotfix for next release
        id: next
        run: echo "value=$(node scripts/version.mjs bump-hotfix)" >> "$GITHUB_OUTPUT"

      - name: Commit next hotfix version
        run: |
          node scripts/version.mjs write "${{ steps.next.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants.js module.json package.json
          git commit -m "chore(release): bump version to ${{ steps.next.outputs.value }} [skip ci]"
          git push
